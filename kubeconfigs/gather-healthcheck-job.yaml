apiVersion: batch/v1
kind: CronJob
metadata:
  name: datadis-gather-healthcheck
  namespace: sime-prod-ingestors
spec:
  suspend: false
  schedule: "0 8 2-30/2 * *"
  timeZone: "Europe/Madrid"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            logger: datadis-logger
          annotations:
            "cluster-autoscaler.kubernetes.io/safe-to-evict": "false"
        spec:
          containers:
          - name: datadis-gather-healthcheck
            image: 853583158095.dkr.ecr.eu-west-1.amazonaws.com/ecr-beegroup-datadis-ingestor:prod
            imagePullPolicy: Always
            command: ["python3", "tools/check_gather_health.py"]
            env:
              - name: CONF_FILE
                value: "config.json"
              - name: LOOKBACK_HOURS
                value: "50"
              - name: DISCORD_WEBHOOK_URL
                valueFrom:
                  secretKeyRef:
                    name: datadis-discord-webhook
                    key: webhook_url
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
            volumeMounts:
            - name: datadis-base-secret
              mountPath: /datadis/config.json
              subPath: config.json
          volumes:
          - name: datadis-base-secret
            secret:
              secretName: datadis-base-secret
              items:
              - key: config.json
                path: config.json
          restartPolicy: Never
          imagePullSecrets:
          - name: odin1pullsecret

# One-time setup:
#
#   1. Create a Discord webhook (Server Settings > Integrations > Webhooks in the
#      channel you want alerts in), then store its URL as a k8s Secret:
#        kubectl create secret generic datadis-discord-webhook \
#          --from-literal=webhook_url='https://discord.com/api/webhooks/...' \
#          -n sime-prod-ingestors
#
#   2. Rebuild/push the image so it has the last_updated field (DatadisGatherer.py)
#      and this script (tools/check_gather_health.py):
#        TAG=$(git rev-parse --short HEAD)
#        docker buildx build --platform linux/amd64,linux/arm64 --push \
#          -t 853583158095.dkr.ecr.eu-west-1.amazonaws.com/ecr-beegroup-datadis-ingestor:prod \
#          -t 853583158095.dkr.ecr.eu-west-1.amazonaws.com/ecr-beegroup-datadis-ingestor:$TAG .
#
#   3. Deploy the CronJob:
#        kubectl apply -f kubeconfigs/gather-healthcheck-job.yaml
#
#   4. To test it immediately instead of waiting for the schedule:
#        kubectl create job --from=cronjob/datadis-gather-healthcheck datadis-gather-healthcheck-manual -n sime-prod-ingestors
#        kubectl logs -f job/datadis-gather-healthcheck-manual -n sime-prod-ingestors