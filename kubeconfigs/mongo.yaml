apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: sime-prod-databases
spec:
  ports:
  - port: 27017
  selector:
    app: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: sime-prod-databases
spec:
  serviceName: "mongodb"
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-root-credentials
              key: username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-root-credentials
              key: password
        ports:
        - containerPort: 27017

        volumeMounts:
        - name: mongo-persistent-data
          mountPath: /data/db

  volumeClaimTemplates:
  - metadata:
      name: mongo-persistent-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 8Gi

# One-time setup
#   kubectl create secret generic mongodb-root-credentials \
#     --from-literal=username='REPLACE_WITH_USERNAME' \
#     --from-literal=password='REPLACE_WITH_PASSWORD' \
#     -n sime-prod-databases
